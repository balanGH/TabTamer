<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabTamer ( Time Tracker )</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>TabTamer</h1>
      <!-- <div class="settings">
        <label class="toggle">
          <input type="checkbox" id="audioToggle" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">Track Audio Tabs</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="darkModeToggle">
          <span class="toggle-slider"></span>
          <span class="toggle-label">Dark Mode</span>
        </label>
      </div> -->
      <div class="header-actions">
        <button id="darkModeToggle" class="icon-btn" title="Toggle Dark Mode">⏾</button>
        <button id="audioToggle" class="icon-btn" title="Track Audio Tabs">🔇</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="today">Today</button>
      <button class="tab-btn" data-tab="week">Week</button>
      <button class="tab-btn" data-tab="month">Month</button>
    </nav>

    <div class="tab-content">
      <div id="today" class="tab-panel active">
        <div class="stats-summary">
          <div class="stat-card">
            <div class="stat-label">Total Time Today</div>
            <div class="stat-value" id="todayTotal">0m</div>
          </div>
        </div>
        <div class="top-sites">
          <h3>Top Sites Today</h3>
          <div id="todaySites" class="sites-list"></div>
        </div>
      </div>

      <div id="week" class="tab-panel">
        <div class="chart-container">
          <canvas id="weekChart"></canvas>
        </div>
        <div class="top-sites">
          <h3>Top Sites This Week</h3>
          <div id="weekSites" class="sites-list"></div>
        </div>
      </div>

      <div id="month" class="tab-panel">
        <div class="chart-container">
          <canvas id="monthChart"></canvas>
        </div>
        <div class="top-sites">
          <h3>Top Sites This Month</h3>
          <div id="monthSites" class="sites-list"></div>
        </div>
      </div>
    </div>

    <footer>
      <button id="clearBtn" class="clear-btn">Clear Session Data</button>
      <div class="session-note">Session data resets when Chrome closes</div>
    </footer>
  </div>

  <script src="chart.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
