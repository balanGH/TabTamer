<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>TabTamer – Advanced Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div class="container">
    <h1>TabTamer Settings</h1>

    <!-- USAGE GRAPH -->
    <section class="card">
      <h2>Site Usage</h2>

      <div class="row">
        <select id="usageRange">
          <option value="today">Today</option>
          <option value="week">Week</option>
          <option value="month">Month</option>
        </select>
      </div>

      <canvas id="usageChart"></canvas>
    </section>

    <!-- TIME LIMITS -->
    <section class="card">
      <h2>Set Daily Time Limit</h2>
      <div class="row">
        <select id="domainSelect"></select>
        <input type="number" id="limitMinutes" placeholder="Minutes" />
        <button id="setLimitBtn">Set</button>
      </div>
      <div id="limitsList"></div>
    </section>

    <!-- VIDEO SPEED SETTINGS -->
    <section class="card">
      <h2>Video Speed Controller</h2>
      <div class="row">
        <label>Default Speed:</label>
        <select id="defaultVideoSpeed">
          <option value="0.25">0.25x (Slowest)</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x (Normal)</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x (Popular)</option>
          <option value="1.75">1.75x</option>
          <option value="2.0">2.0x</option>
          <option value="2.5">2.5x (Fast)</option>
          <option value="3.0">3.0x</option>
          <option value="4.0">4.0x (Maximum)</option>
        </select>
      </div>
      <div class="row">
        <label>Keyboard Shortcuts:</label>
        <div style="font-size: 13px; color: #666;">
          <kbd>,</kbd> or <kbd>
            << /kbd> - Decrease speed<br>
              <kbd>.</kbd> or <kbd>></kbd> - Increase speed
        </div>
      </div>
      <div id="status"
        style="margin-top: 10px; color: #667eea; font-weight: 500; opacity: 0; transition: opacity 0.3s;"></div>
      <div id="videoSpeedList"></div>
    </section>

    <!-- ELEMENT / CSS BLOCK -->
    <section class="card">
      <h2>Custom CSS / Element Block</h2>
      <div class="row">
        <input id="cssDomain" placeholder="example.com" />
        <textarea id="cssRules" placeholder=".shorts, #ads { display:none }"></textarea>
        <button id="saveCssBtn">Save</button>
      </div>
      <div id="cssList"></div>
    </section>

    <!-- BACKUP -->
    <section class="card">
      <h2>Backup & Restore</h2>
      <button id="exportBtn">Export Backup</button>
      <input type="file" id="importFile" hidden />
      <button id="importBtn">Import Backup</button>
      <p id="status"></p>
    </section>
  </div>

  <script src="../../assets/chart.min.js"></script>
  <script src="options.js"></script>
</body>

</html>
